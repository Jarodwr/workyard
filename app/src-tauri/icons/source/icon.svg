    <rect x="204" y="412" width="168" height="120" rx="32" opacity="0.55"/>
    <rect x="204" y="564" width="168" height="120" rx="32" opacity="0.3"/>
    <rect x="428" y="260" width="168" height="120" rx="32"/>
    <rect x="428" y="412" width="168" height="120" rx="32"/>
    <rect x="428" y="564" width="168" height="120" rx="32" opacity="0.55"/>
    <rect x="652" y="260" width="168" height="120" rx="32" opacity="0.55"/>
    <rect x="652" y="412" width="168" height="120" rx="32" opacity="0.3"/>
  </g>
</svg>
