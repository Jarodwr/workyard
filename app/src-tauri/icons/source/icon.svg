<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16251f"/>
      <stop offset="1" stop-color="#0b1411"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- yard rail: the ground line the lanes stand on -->
  <rect x="204" y="740" width="616" height="40" rx="20" fill="#2f6b55"/>
