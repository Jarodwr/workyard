[package]
name = "workyard-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "workyard"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ctrlc = { version = "3", features = ["termination"] }
serde_json.workspace = true
workyard-core = { path = "../workyard-core" }
workyard-orchestrator = { path = "../workyard-orchestrator" }
